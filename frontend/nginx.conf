server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS resolves Compose service names at request time.
    # Runtime resolution keeps Nginx restart-safe when the backend container is
    # recreated after this frontend container has started.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $backend_upstream backend:8000;

    # Keep browser requests same-origin. Docker Compose resolves the backend
    # service name on its private network, so the API never needs a public
    # browser-facing port to serve this UI.
    location /api/ {
        # Variable-based proxy targets retain the original URI, unlike a
        # literal `proxy_pass .../`; strip the browser-only `/api/` prefix
        # explicitly so FastAPI receives `/predict`, `/ready`, and so on.
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
